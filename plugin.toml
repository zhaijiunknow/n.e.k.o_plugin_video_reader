[plugin]
id = "video_reader"
name = "看视频"
description = "查看用户发来的视频文件、视频网址和 B 站链接，按画面变化抽取关键帧并给出带时间点的反馈。"
keywords = ["视频", "看视频", "B站", "bilibili", "b23.tv", "video", "总结视频"]
version = "0.2.0"
type = "plugin"
entry = "plugin.plugins.video_reader:VideoReaderPlugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.models.vision]
label = "视频画面理解"
required = true
capabilities = ["text", "image_input"]

[plugin_runtime]
enabled = true
auto_start = true

[video]
# 单次观看范围；长视频可通过 start_seconds 接着看。
max_seconds = 300
max_sheets = 24
fps = 12
quality = "low"
node_path = ""
max_download_mb = 256
# 留空时查找 PATH，再使用 imageio-ffmpeg 自带的可执行文件。
ffmpeg_path = ""
# 可选 Netscape cookies 文件，仅用于用户已授权的视频访问，不自动读取浏览器。
cookies_file = ""
